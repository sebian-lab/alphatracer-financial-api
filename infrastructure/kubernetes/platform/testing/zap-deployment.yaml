# OWASP ZAP — DAST Scanner Deployment
# Runs ZAP in daemon mode with API enabled for automated scanning
# UI: http://localhost:8090
# API: http://localhost:8090/JSON/core/view/alerts/
---
apiVersion: v1
kind: Namespace
metadata:
  name: testing
  labels:
    app.kubernetes.io/managed-by: alphatracer-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zap
  namespace: testing
  labels:
    app: zap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zap
  template:
    metadata:
      labels:
        app: zap
    spec:
      containers:
      - name: zap
        image: ghcr.io/zaproxy/zaproxy:stable
        args:
        - zap.sh
        - -daemon
        - -host
        - "0.0.0.0"
        - -port
        - "8090"
        - -config
        - api.addrs.addr.name=.*
        - -config
        - api.addrs.addr.regex=true
        - -config
        - api.disablekey=true
        ports:
        - containerPort: 8090
          name: http
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /JSON/core/view/version/
            port: 8090
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: zap
  namespace: testing
  labels:
    app: zap
spec:
  type: ClusterIP
  ports:
  - port: 8090
    targetPort: 8090
    name: http
  selector:
    app: zap
