# OpenCost — Kubernetes Cost Monitoring
# Chart: opencost/opencost
# Repo: helm repo add opencost https://opencost.github.io/opencost-helm-chart
# Install: helm install opencost opencost/opencost -n monitoring -f helm-values.yaml
# UI: http://localhost:9095

opencost:
  ui:
    enabled: true

  exporter:
    defaultClusterId: "alphatracer-k3s"

  prometheus:
    internal:
      enabled: true
      serviceName: kube-prometheus-kube-prome-prometheus
      namespaceName: monitoring
      port: 9090

  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

service:
  type: ClusterIP
  port: 9090  # OpenCost UI port
