# Keycloak SSO — Helm Values
# Chart: bitnami/keycloak
# Repo: helm repo add bitnami https://charts.bitnami.com/bitnami
# Install: helm install keycloak bitnami/keycloak -n keycloak --create-namespace -f helm-values.yaml
# UI: http://localhost:8081 (admin/alphatracer)

auth:
  adminUser: admin
  adminPassword: alphatracer

# HTTP mode for local development (no TLS required)
proxy: edge
httpRelativePath: "/"

service:
  type: ClusterIP
  ports:
    http: 8080

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: 500m

# Use embedded H2 database for local dev
postgresql:
  enabled: false

externalDatabase:
  host: ""
  port: 0
  user: ""
  password: ""
  database: ""

# Keycloak realm import for AlphaTracer
keycloakConfigCli:
  enabled: true
  configuration:
    alphatracer-realm.json: |
      {
        "realm": "alphatracer",
        "enabled": true,
        "displayName": "AlphaTracer",
        "sslRequired": "none",
        "registrationAllowed": false,
        "clients": [
          {
            "clientId": "argocd",
            "enabled": true,
            "protocol": "openid-connect",
            "publicClient": false,
            "redirectUris": ["https://localhost:8080/auth/callback", "https://argocd.local/auth/callback"],
            "webOrigins": ["*"],
            "standardFlowEnabled": true,
            "directAccessGrantsEnabled": true,
            "secret": "argocd-oidc-secret"
          },
          {
            "clientId": "grafana",
            "enabled": true,
            "protocol": "openid-connect",
            "publicClient": false,
            "redirectUris": ["http://localhost:3000/login/generic_oauth", "http://grafana.local/login/generic_oauth"],
            "webOrigins": ["*"],
            "standardFlowEnabled": true,
            "directAccessGrantsEnabled": true,
            "secret": "grafana-oidc-secret"
          },
          {
            "clientId": "alphatracer-api",
            "enabled": true,
            "protocol": "openid-connect",
            "publicClient": true,
            "redirectUris": ["http://localhost:8011/*", "https://alphatracer.local/*"],
            "webOrigins": ["*"],
            "standardFlowEnabled": true,
            "directAccessGrantsEnabled": true
          }
        ],
        "users": [
          {
            "username": "dev-user",
            "email": "dev@alphatracer.local",
            "enabled": true,
            "credentials": [{ "type": "password", "value": "dev-password", "temporary": false }],
            "realmRoles": ["user"]
          },
          {
            "username": "admin-user",
            "email": "admin@alphatracer.local",
            "enabled": true,
            "credentials": [{ "type": "password", "value": "admin-password", "temporary": false }],
            "realmRoles": ["admin"]
          }
        ],
        "roles": {
          "realm": [
            { "name": "user", "description": "Regular API user" },
            { "name": "admin", "description": "Admin with full access" }
          ]
        }
      }
