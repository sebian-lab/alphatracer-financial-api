# DefectDojo — Vulnerability Management Platform
# Chart: defectdojo/defectdojo
# Repo: helm repo add defectdojo https://raw.githubusercontent.com/DefectDojo/django-DefectDojo/helm-charts
# Install: helm install defectdojo defectdojo/defectdojo -n compliance --create-namespace -f defectdojo-helm-values.yaml
# UI: http://localhost:8084 (admin/alphatracer)

django:
  ingress:
    enabled: false
  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 512Mi
      cpu: 500m

# Admin credentials
admin:
  user: admin
  password: alphatracer
  firstName: AlphaTracer
  lastName: Admin
  email: admin@alphatracer.local

# Use SQLite for local dev to reduce resource usage
database: sqlite
postgresql:
  enabled: false

# Service configuration
service:
  type: ClusterIP
  port: 8080

# Celery workers for background tasks
celery:
  worker:
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 200m
  beat:
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 100m

# Redis for task queue
redis:
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m
