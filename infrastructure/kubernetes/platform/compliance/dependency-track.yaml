# Dependency-Track — OWASP SBOM Analysis Platform
# Ingests SBOM artifacts from CI pipeline for vulnerability tracking
# UI: http://localhost:8083 (admin/admin — change on first login)
---
apiVersion: v1
kind: Namespace
metadata:
  name: compliance
  labels:
    app.kubernetes.io/managed-by: alphatracer-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-track
  namespace: compliance
  labels:
    app: dependency-track
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dependency-track
  template:
    metadata:
      labels:
        app: dependency-track
    spec:
      containers:
      - name: dependency-track
        image: dependencytrack/apiserver:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ALPINE_DATABASE_MODE
          value: "external"
        - name: ALPINE_DATABASE_URL
          value: "jdbc:h2:mem:dtrack"
        - name: ALPINE_DATABASE_DRIVER
          value: "org.h2.Driver"
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 2Gi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /api/version
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
      - name: frontend
        image: dependencytrack/frontend:latest
        ports:
        - containerPort: 8081
          name: frontend
        env:
        - name: API_BASE_URL
          value: "http://localhost:8080"
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: dependency-track
  namespace: compliance
  labels:
    app: dependency-track
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: api
  - port: 8081
    targetPort: 8081
    name: frontend
  selector:
    app: dependency-track
