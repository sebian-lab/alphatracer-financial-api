# cert-manager Helm Values for Local Development
# Chart: jetstack/cert-manager
# Repo: helm repo add jetstack https://charts.jetstack.io
# Install: helm install cert-manager jetstack/cert-manager -n cert-manager --create-namespace --set installCRDs=true -f cert-manager-values.yaml

installCRDs: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

webhook:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

cainjector:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 50m
      memory: 128Mi
