# Self-Signed ClusterIssuer for local TLS certificates
# cert-manager will auto-generate TLS certs for all IngressRoutes
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
# CA Certificate for signing local domain certs
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: alphatracer-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: alphatracer-ca
  secretName: alphatracer-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: alphatracer-ca-issuer
spec:
  ca:
    secretName: alphatracer-ca-secret
