# Policy Reporter — Helm Values
# Chart: policy-reporter/policy-reporter
# Repo: helm repo add policy-reporter https://kyverno.github.io/policy-reporter
# Install: helm install policy-reporter policy-reporter/policy-reporter -n kyverno -f helm-values.yaml
# UI: http://localhost:8082

ui:
  enabled: true
  service:
    type: ClusterIP
    port: 8082

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

# Target: forward policy violations to Loki for log aggregation
target:
  loki:
    host: "http://loki.monitoring.svc:3100"
    minimumPriority: "warning"
    skipExistingOnStartup: true

# Metrics endpoint for Prometheus scraping
metrics:
  enabled: true
