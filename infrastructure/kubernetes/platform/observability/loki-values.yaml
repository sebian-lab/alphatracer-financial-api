# Grafana Loki Stack — Helm Values
# Chart: grafana/loki-stack
# Repo: helm repo add grafana https://grafana.github.io/helm-charts
# Install: helm install loki grafana/loki-stack -n monitoring -f loki-values.yaml
# Endpoint: http://localhost:3100

loki:
  enabled: true
  # Single binary mode for local dev
  isDefault: false
  persistence:
    enabled: false
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m
  config:
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      ring:
        kvstore:
          store: inmemory
    limits_config:
      retention_period: 168h  # 7 days

promtail:
  enabled: true
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m
  config:
    clients:
    - url: http://loki:3100/loki/api/v1/push
    snippets:
      pipelineStages:
      - docker: {}
      - match:
          selector: '{namespace=~"alphatracer.*"}'
          stages:
          - json:
              expressions:
                level: level
                msg: msg
          - labels:
              level:

# Grafana already deployed via kube-prometheus-stack
grafana:
  enabled: false
