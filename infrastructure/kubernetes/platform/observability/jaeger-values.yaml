# Jaeger All-in-One — Helm Values
# Chart: jaegertracing/jaeger
# Repo: helm repo add jaegertracing https://jaegertracing.github.io/helm-charts
# Install: helm install jaeger jaegertracing/jaeger -n monitoring -f jaeger-values.yaml
# UI: http://localhost:16686

# All-in-one deployment (query + collector + agent in a single pod)
provisionDataStore:
  cassandra: false
  elasticsearch: false

allInOne:
  enabled: true
  image: jaegertracing/all-in-one
  tag: latest
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

# In-memory storage for local dev
storage:
  type: memory

# Collector receives traces from OTel Collector or direct instrumentation
collector:
  enabled: false  # all-in-one includes collector

query:
  enabled: false  # all-in-one includes query
  service:
    type: ClusterIP
    port: 16686

agent:
  enabled: false  # all-in-one includes agent
