# Alertmanager Webhook Receiver — catches alerts for local demo/portfolio
# Logs all alerts to stdout (visible in Loki) and serves a simple UI
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-webhook
  namespace: monitoring
  labels:
    app: alertmanager-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager-webhook
  template:
    metadata:
      labels:
        app: alertmanager-webhook
    spec:
      containers:
      - name: webhook
        image: timonwong/prometheus-webhook-dingtalk:latest
        args:
        - --web.listen-address=:9095
        - --log.level=info
        ports:
        - containerPort: 9095
          name: http
        resources:
          requests:
            memory: 32Mi
            cpu: 25m
          limits:
            memory: 64Mi
            cpu: 50m
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-webhook
  namespace: monitoring
  labels:
    app: alertmanager-webhook
spec:
  type: ClusterIP
  ports:
  - port: 9095
    targetPort: 9095
    name: http
  selector:
    app: alertmanager-webhook
