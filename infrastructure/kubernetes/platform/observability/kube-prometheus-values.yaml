# kube-prometheus-stack — Helm Values
# Chart: prometheus-community/kube-prometheus-stack
# Repo: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# Install: helm upgrade --install kube-prometheus prometheus-community/kube-prometheus-stack -n monitoring --create-namespace -f kube-prometheus-values.yaml
#
# Endpoints:
#   Prometheus:   http://localhost:9090
#   Grafana:      http://localhost:3000 (admin/alphatracer)
#   Alertmanager: http://localhost:9093

# ─── Prometheus ───
prometheus:
  prometheusSpec:
    # Scrape all ServiceMonitors across namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # Retention for local dev
    retention: 7d

    # Resource limits
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m

    # Additional scrape configs for AlphaTracer namespaces
    additionalScrapeConfigs:
    - job_name: 'alphatracer-prod'
      kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: ['alphatracer']
      relabel_configs:
      - source_labels: [__meta_kubernetes_service_label_app]
        regex: alphatracer
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

    - job_name: 'alphatracer-dev'
      kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: ['alphatracer-dev']
      relabel_configs:
      - source_labels: [__meta_kubernetes_service_label_app]
        regex: alphatracer
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

# ─── Alertmanager ───
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 100m
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['namespace', 'alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default-webhook'
      routes:
      - receiver: 'critical-webhook'
        match:
          severity: critical
      - receiver: 'alphatracer-alerts'
        match_re:
          namespace: 'alphatracer.*'
    receivers:
    - name: 'default-webhook'
      webhook_configs:
      - url: 'http://alertmanager-webhook.monitoring.svc:9095/webhook'
        send_resolved: true
    - name: 'critical-webhook'
      webhook_configs:
      - url: 'http://alertmanager-webhook.monitoring.svc:9095/webhook'
        send_resolved: true
    - name: 'alphatracer-alerts'
      webhook_configs:
      - url: 'http://alertmanager-webhook.monitoring.svc:9095/webhook'
        send_resolved: true

# ─── Grafana ───
grafana:
  enabled: true
  adminPassword: "alphatracer"

  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

  # Additional datasources (Loki + Jaeger)
  additionalDataSources:
  - name: Loki
    type: loki
    url: http://loki.monitoring.svc:3100
    access: proxy
    isDefault: false
  - name: Jaeger
    type: jaeger
    url: http://jaeger-query.monitoring.svc:16686
    access: proxy
    isDefault: false

  # Dashboard provisioning via ConfigMaps
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'alphatracer'
        orgId: 1
        folder: 'AlphaTracer'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/alphatracer

  dashboardsConfigMaps:
    alphatracer: "grafana-alphatracer-dashboards"

  sidecar:
    dashboards:
      enabled: true
      searchNamespace: monitoring

# ─── kube-state-metrics ───
kubeStateMetrics:
  enabled: true

# ─── node-exporter ───
nodeExporter:
  enabled: true

# ─── PrometheusRule for AlphaTracer alerts ───
additionalPrometheusRulesMap:
  alphatracer-alerts:
    groups:
    - name: alphatracer.rules
      rules:
      - alert: AlphaTracerDown
        expr: up{job=~"alphatracer.*"} == 0
        for: 1m
        labels:
          severity: critical
          namespace: alphatracer
        annotations:
          summary: "AlphaTracer API is down"
          description: "{{ $labels.instance }} in {{ $labels.namespace }} has been down for more than 1 minute."

      - alert: AlphaTracerHighErrorRate
        expr: |
          sum(rate(http_requests_total{job=~"alphatracer.*",status=~"5.."}[5m])) /
          sum(rate(http_requests_total{job=~"alphatracer.*"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          namespace: alphatracer
        annotations:
          summary: "AlphaTracer error rate > 5%"
          description: "Error rate is {{ $value | humanizePercentage }} in the last 5 minutes."

      - alert: AlphaTracerHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=~"alphatracer.*"}[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
          namespace: alphatracer
        annotations:
          summary: "AlphaTracer P95 latency > 1s"
          description: "95th percentile latency is {{ $value }}s."
