# Chaos Mesh — Helm Values
# Chart: chaos-mesh/chaos-mesh
# Repo: helm repo add chaos-mesh https://charts.chaos-mesh.org
# Install: helm install chaos-mesh chaos-mesh/chaos-mesh -n chaos-mesh --create-namespace -f helm-values.yaml
# Dashboard: http://localhost:2333

dashboard:
  enabled: true
  service:
    type: ClusterIP
    port: 2333
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m
  # Security — disable auth for local dev
  securityMode: false

controllerManager:
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

chaosDaemon:
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m
  # Required for K3s/containerd runtime
  runtime: containerd
  socketPath: /run/k3s/containerd/containerd.sock
