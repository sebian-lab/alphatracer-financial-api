# PostgreSQL — Helm Values
# Chart: bitnami/postgresql
# Repo: helm repo add bitnami https://charts.bitnami.com/bitnami
# Install: helm install postgresql bitnami/postgresql -n alphatracer --create-namespace -f postgres-helm-values.yaml

auth:
  postgresPassword: "alphatracer-admin-pwd"
  username: "alphatracer"
  password: "alphatracer-db-pwd"
  database: "trading_db"

primary:
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 250m

  persistence:
    enabled: true
    size: 1Gi

  # Init scripts to create schema
  initdb:
    scripts:
      init.sql: |
        -- AlphaTracer DB initialization
        CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

        -- Grant all privileges to the alphatracer user
        GRANT ALL PRIVILEGES ON DATABASE trading_db TO alphatracer;

# Metrics exporter for Prometheus scraping
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus
