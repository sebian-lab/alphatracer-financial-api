name: Full CI/CD Pipeline
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # 1. Unit tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt pytest bandit httpx
      - name: Run pytest
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "test-secret-key-1234"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          PRIMARY_TICKER_CSV: "https://raw.githubusercontent.com/abbadata/stock-tickers/main/data/all.csv"
          SECONDARY_TICKER_CSV: "https://raw.githubusercontent.com/Ate329/top-us-stock-tickers/main/tickers/all.csv"
        run: pytest

  # 2. SAST (Bandit Scanner)
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install bandit
      - run: bandit -r app/ -ll -ii

  # 3. Security Scanning + SBOM + Keyless Signing
  security:
    needs: [test, sast]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/reusable-security.yml
    with:
      image-tag: ${{ github.sha }}

  # 4. Dry-Run IaC Validation (Non-blocking for K3s local setups)
  terraform-plan:
    needs: security
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      - name: Terraform Plan (Dry-Run, Zero Cloud Cost)
        working-directory: infrastructure/terraform
        env:
          AWS_ACCESS_KEY_ID: "mock_key"
          AWS_SECRET_ACCESS_KEY: "mock_secret"
          AWS_REGION: "eu-west-1"
        run: |
          terraform init -backend=false
          terraform plan

  # 5. GitOps Image Update (Runs ONLY on post-merge branch pushes)
  update-manifest:
    needs: security
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Update image tag in Production Kustomize Overlay
        if: github.ref == 'refs/heads/main'
        run: |
          cd infrastructure/kubernetes/overlays/prod
          kustomize edit set image ghcr.io/${{ github.repository }}=ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Update image tag in Development Kustomize Overlay
        if: github.ref == 'refs/heads/dev'
        run: |
          cd infrastructure/kubernetes/overlays/dev
          kustomize edit set image ghcr.io/${{ github.repository }}=ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/kubernetes/overlays/
          git commit -m "chore: update container image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push || echo "⚠️ Branch ruleset active: push skipped."
