name: Full CI/CD Pipeline
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # 1. Unit tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt pytest bandit httpx
      - name: Run pytest
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-pytest-ephemeral-key' }}
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          PRIMARY_TICKER_CSV: "https://raw.githubusercontent.com/abbadata/stock-tickers/main/data/all.csv"
          SECONDARY_TICKER_CSV: "https://raw.githubusercontent.com/Ate329/top-us-stock-tickers/main/tickers/all.csv"
        run: pytest

  # 2. SAST (Bandit Scanner)
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install bandit
      - run: bandit -r app/ -ll -ii

  # 3. Security Scanning + SBOM + Keyless Signing (Reusable Workflow)
  security:
    needs: [test, sast]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/reusable-security.yml
    with:
      image-tag: ${{ github.sha }}

  # 4. Zero-Cost Infrastructure as Code Validation (Dry-Run Plan)
  terraform-plan:
    needs: security
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      - name: Terraform Plan (Dry-Run, Zero Cloud Cost)
        working-directory: infrastructure/terraform
        env:
          AWS_ACCESS_KEY_ID: "mock_key"
          AWS_SECRET_ACCESS_KEY: "mock_secret"
          AWS_REGION: "eu-west-1"
        run: |
          terraform init -backend=false
          terraform plan

  # 5. GitOps Automated PR for Kustomize Manifest Updates (PAT-Free & Branch Protection Compliant)
  update-manifest:
    needs: security
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Update image tag in Kustomize overlay
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            cd infrastructure/kubernetes/overlays/prod
          else
            cd infrastructure/kubernetes/overlays/dev
          fi
          kustomize edit set image ghcr.io/${{ github.repository }}=ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Create Pull Request for Manifest Update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_BRANCH="${{ github.ref_name }}"
          BRANCH_NAME="update-manifests-${{ github.sha }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b $BRANCH_NAME
          git add infrastructure/kubernetes/overlays/
          git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]" || exit 0
          git push origin $BRANCH_NAME

          gh pr create \
            --base $TARGET_BRANCH \
            --head $BRANCH_NAME \
            --title "chore: update container image to ${{ github.sha }}" \
            --body "Automated Kustomize manifest update from CI pipeline." \
            --label "automated"

      - name: Enable Auto-Merge (Optional)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head "update-manifests-${{ github.sha }}" --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr merge --auto --merge "$PR_NUMBER" || echo "Auto-merge not enabled on repository settings, PR remains open for review."
          fi
