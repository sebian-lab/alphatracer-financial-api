name: Full CI/CD Pipeline
on:
  push:
    branches: [ main, dev, prod ]
  pull_request:
    branches: [ main, dev, prod ]

jobs:
  # 1. Unit tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt pytest bandit httpx
      - name: Run pytest
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "test-secret-key-1234"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          PRIMARY_TICKER_CSV: "https://raw.githubusercontent.com/abbadata/stock-tickers/main/data/all.csv"
          SECONDARY_TICKER_CSV: "https://raw.githubusercontent.com/Ate329/top-us-stock-tickers/main/tickers/all.csv"
        run: pytest

  # 2. SAST (Bandit Scanner)
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install bandit
      - run: bandit -r app/ -ll -ii

  # 3. Security Scanning + SBOM + Keyless Signing (Push to GHCR)
  security:
    needs: [test, sast]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/reusable-security.yml
    with:
      image-tag: ${{ github.sha }}

  # 4. Production Promotion: Update Production Docker Compose with verified signed image tag
  # Gated by GitHub Environment 'production' for manual lead approval on 'prod' branch
  update-prod-compose:
    needs: security
    if: github.event_name == 'push' && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/prod' && 'production' || 'development' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update signed image tag in docker-compose.prod.yml
        run: |
          sed -i -E "s|(image: ghcr.io/${{ github.repository }}:).*|\1${{ github.sha }}|g" docker-compose.prod.yml
      - name: Commit and push compose update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.prod.yml
          git commit -m "chore(prod): update signed container image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push || echo "⚠️ Branch ruleset active: push skipped."
