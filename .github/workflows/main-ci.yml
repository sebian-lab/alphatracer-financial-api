name: Full CI/CD Pipeline
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # 1. Unit tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt pytest bandit httpx
      - name: Run pytest
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "test-secret-key-1234"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          PRIMARY_TICKER_CSV: "https://raw.githubusercontent.com/abbadata/stock-tickers/main/data/all.csv"
          SECONDARY_TICKER_CSV: "https://raw.githubusercontent.com/Ate329/top-us-stock-tickers/main/tickers/all.csv"
        run: pytest

  # 2. SAST (Bandit Scanner)
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install bandit
      - run: bandit -r app/ -ll -ii

  # 3. Security Scanning + SBOM + Keyless Signing (Reusable Workflow)
  security:
    needs: [test, sast]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/reusable-security.yml
    with:
      image-tag: ${{ github.sha }}
