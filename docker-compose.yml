version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: alphatracer-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-trading_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alphatracer-api
    restart: always
    ports:
      - "8011:8011"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres_secure_pass@db:5432/trading_db}
      SECRET_KEY: ${SECRET_KEY:-test-secret-key-1234}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      PRIMARY_TICKER_CSV: https://raw.githubusercontent.com/abbadata/stock-tickers/main/data/all.csv
      SECONDARY_TICKER_CSV: https://raw.githubusercontent.com/Ate329/top-us-stock-tickers/main/tickers/all.csv
      TICKER_UPDATE_INTERVAL_HOURS: 12
      PRICE_API_PROVIDER: yfinance
      ALLOWED_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy

  trivy:
    image: aquasec/trivy:latest
    container_name: alphatracer-trivy
    command: server --listen 0.0.0.0:4954
    ports:
      - "4954:4954"
    restart: unless-stopped

  vault:
    image: hashicorp/vault:latest
    container_name: alphatracer-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    restart: unless-stopped

  prom:
    image: prom/prometheus:latest
    container_name: alphatracer-prom
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  k3s:
    image: rancher/k3s:v1.31.0-k3s1
    container_name: alphatracer-k3s
    privileged: true
    command: server --disable traefik
    environment:
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
      - K3S_KUBECONFIG_MODE=666
    ports:
      - "6443:6443"
    volumes:
      - k3s_data:/var/lib/rancher/k3s
      - ./infrastructure/kubernetes:/output
    restart: unless-stopped

volumes:
  postgres_data:
  k3s_data:
